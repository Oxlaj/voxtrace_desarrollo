<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Iniciar sesión | VoxTrace</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/voxtrace.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/layout.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand brand-login"><span class="brand-mark">V</span><span>VoxTrace</span></div>
    <p class="eyebrow">Acceso autorizado</p>
    <h1>Iniciar sesión</h1>
    <p class="muted">Sistema de apoyo al análisis forense de voz</p>
    <form id="login-form" novalidate>
      <label for="correo">Correo institucional</label>
      <input id="correo" name="correo" type="email" autocomplete="username" required maxlength="150">
      <label for="password">Contraseña</label>
      <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="toggle-password" type="button" aria-label="Mostrar contraseña">Mostrar</button></div>
      <div id="form-message" class="message" role="alert" aria-live="polite"></div>
      <button class="button button-primary button-full" type="submit">Iniciar sesión</button>
    </form>
  </main>
  <script src="{{ url_for('static', path='/js/api.js') }}"></script>
  <script src="{{ url_for('static', path='/js/login.js') }}"></script>
</body>
</html>
