{% extends "base.html" %}{% block title %}Usuarios | VoxTrace{% endblock %}{% block content %}
<header class="page-header"><div><h1>Usuarios</h1><p class="muted">Gestión segura de cuentas y roles existentes.</p></div><a class="button button-primary" href="/app/usuarios/nuevo">Crear usuario</a></header>
<section class="panel"><form id="user-filters" class="filter-grid"><div><label for="user-search">Nombre o correo</label><input id="user-search"></div><div><label for="role-filter">Rol</label><select id="role-filter"><option value="">Todos</option></select></div><div><label for="state-filter">Estado</label><select id="state-filter"><option value="">Todos</option><option value="true">Activo</option><option value="false">Inactivo</option></select></div><button class="button button-secondary" type="submit">Buscar</button></form><div id="users-message" class="message"></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Fecha</th><th>Acción</th></tr></thead><tbody id="users-body"></tbody></table></div></section>
{% endblock %}{% block scripts %}<script src="{{ url_for('static', path='/js/usuarios.js') }}"></script>{% endblock %}
