{% extends "base.html" %}{% block title %}Auditoría | VoxTrace{% endblock %}{% block content %}
<header class="page-header"><div><h1>Bitácora de auditoría</h1><p class="muted">Consulta administrativa de eventos registrados por VoxTrace.</p></div></header>
<section class="panel"><form id="audit-filters" class="filter-grid"><div><label for="audit-from">Fecha desde</label><input id="audit-from" type="date"></div><div><label for="audit-to">Fecha hasta</label><input id="audit-to" type="date"></div><div><label for="audit-user">ID de usuario</label><input id="audit-user" type="number" min="1"></div><div><label for="audit-action">Acción</label><input id="audit-action" maxlength="150"></div><div><label for="audit-ip">Dirección IP</label><input id="audit-ip" maxlength="45"></div><div><label for="audit-search">Buscar</label><input id="audit-search" maxlength="100"></div><div class="filter-actions"><button class="button button-primary">Aplicar</button><button id="audit-clear" class="button button-ghost-light" type="button">Limpiar</button></div></form><div id="audit-message" class="message" role="status"></div><div class="table-wrap"><table><thead><tr><th>Fecha/hora</th><th>Usuario</th><th>Acción</th><th>IP</th><th>Detalle</th></tr></thead><tbody id="audit-body"></tbody></table></div><nav class="pagination"><button id="audit-prev" class="button button-ghost-light">Anterior</button><span id="audit-page"></span><button id="audit-next" class="button button-ghost-light">Siguiente</button></nav></section>
{% endblock %}{% block scripts %}<script src="{{ url_for('static', path='/js/auditoria.js') }}"></script>{% endblock %}
